name: Deploy to VPS Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Rsync
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            SUDO=""
            if command -v sudo >/dev/null 2>&1 && [ "$USER" != "root" ]; then
              SUDO="sudo"
            fi

            echo "=== 1. Ensuring target directory exists ==="
            $SUDO mkdir -p /var/www/nightmare
            $SUDO chown -R $USER:$USER /var/www/nightmare

            echo "=== 2. Pulling latest code ==="
            if [ -d "/var/www/nightmare/.git" ]; then
              cd /var/www/nightmare
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/JavohirX/TNBC /var/www/nightmare
              cd /var/www/nightmare
            fi

            echo "=== 3. Setting up Python environment for Telegram Bot ==="
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install aiogram python-dotenv

            echo "=== 4. Reloading Nginx & Restarting Bot Service ==="
            $SUDO systemctl reload nginx || true
            $SUDO systemctl restart nightmare-bot || true

            echo "=== Deployment to VPS Completed Successfully! ==="

