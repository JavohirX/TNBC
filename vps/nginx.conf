server {
    listen 80;
    server_name 193.36.236.221.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 193.36.236.221.sslip.io;

    ssl_certificate /etc/letsencrypt/live/193.36.236.221.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.36.236.221.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/nightmare;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram: t.me;" always;
    add_header Access-Control-Allow-Origin * always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|mar|dat|mid|rpl)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
