<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nightmare Before Christmas - Pure JS Engine Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e2ec;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0d0e15;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            overflow-y: auto;
        }

        #header {
            padding: 10px 14px;
            background: #141724;
            border-bottom: 1px solid #232638;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f59e0b;
            letter-spacing: 0.5px;
        }

        .tag {
            font-size: 0.7rem;
            background: #22c55e;
            color: #052e16;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        #screen-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #232635;
        }

        #screen-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 52vh;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #000;
        }

        /* --- 3D TACTILE RETRO CONTROLS --- */
        .mobile-controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 10px 14px;
            background: radial-gradient(circle at 50% 15%, #181b29 0%, #0a0b12 100%);
            border-top: 1px solid #292d3f;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Base 3D Tactile Button */
        .btn-3d {
            position: relative;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Slate 3D Keycap */
        .btn-3d-dark {
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #e2e8f0;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* Mechanical Button Pressed Animation */
        .btn-3d-dark:active, .btn-3d-dark.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(56, 189, 248, 0.4);
            background: linear-gradient(180deg, #222636 0%, #161824 100%);
            color: #38bdf8;
        }

        /* TOP SOFTKEYS */
        .softkey-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .btn-3d-soft {
            flex: 1.2;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(180deg, #444b68 0%, #2b3046 50%, #1e2232 100%);
            color: #f1f5f9;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 4px 0 #0c0e16,
                0 6px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-3d-soft:active, .btn-3d-soft.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #0c0e16,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(245, 158, 11, 0.5);
            background: linear-gradient(180deg, #222636 0%, #171924 100%);
            color: #f59e0b;
        }

        .soft-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .center-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #0f111a;
            padding: 3px 6px;
            border-radius: 16px;
            border: 1px solid #232738;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9em;
            background: linear-gradient(180deg, #2a2e40 0%, #1a1c29 100%);
            border: 1px solid #33384e;
            color: #94a3b8;
            box-shadow: 0 2px 0 #0c0d15;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #0c0d15;
            color: #f59e0b;
        }

        /* --- MAIN PAD AREA --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            padding: 2px 4px;
        }

        /* 3x3 8-WAY D-PAD WITH DIAGONALS & CENTER OK */
        .dpad-8way-grid {
            width: 154px;
            height: 154px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: #11131e;
            padding: 5px;
            border-radius: 20px;
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .dpad-cell {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            font-weight: 800;
        }

        .dpad-cardinal {
            font-size: 1.35em;
            color: #f8fafc;
        }

        .dpad-diagonal {
            font-size: 1.15em;
            color: #7dd3fc;
            background: linear-gradient(180deg, #2a2e42 0%, #1c1f2e 100%);
            border-radius: 6px;
        }

        .dpad-center-ok {
            background: linear-gradient(180deg, #443c2c 0%, #2e281b 50%, #1f1b12 100%);
            color: #fbbf24;
            font-size: 0.88em;
            border-radius: 6px;
            border-top: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 
                0 4px 0 #120f09,
                0 5px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .dpad-center-ok:active, .dpad-center-ok.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #120f09,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(251, 191, 36, 0.5);
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            color: #fff;
        }

        /* --- RIGHT ACTION AREA (FIRE + *, 0, # CLUSTER) --- */
        .action-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-right: 2px;
        }

        .btn-3d-fire {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(180deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
            color: #fff;
            font-size: 0.95em;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 5px 0 #7c2d12,
                0 8px 16px rgba(234, 88, 12, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-3d-fire:active, .btn-3d-fire.active {
            transform: translateY(4px);
            box-shadow: 
                0 1px 0 #7c2d12,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 6px rgba(0, 0, 0, 0.6),
                0 0 18px rgba(249, 115, 22, 0.7);
            background: linear-gradient(180deg, #c2410c 0%, #9a3412 100%);
        }

        .btn-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .key-row-3 {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .btn-3d-trio {
            width: 44px;
            height: 44px;
            border-radius: 9px;
            font-size: 1.15em;
            font-weight: 800;
        }

        .btn-3d-trio .sub-txt {
            font-size: 0.52em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 0;
            line-height: 1;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="header">
            <span class="title">Nightmare Before Christmas</span>
            <span class="tag">Pure JS Canvas</span>
        </div>

        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="game-canvas" width="240" height="320"></canvas>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (3D RETRO PHONE) -->
        <div class="mobile-controls-panel">
            <!-- TOP SOFTKEYS (NOKIA TOP-LEFT & TOP-RIGHT) -->
            <div class="softkey-row">
                <button id="btn-lsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F1" aria-label="Left Soft Key">
                    <span>ROOMS</span>
                    <span class="soft-label-sub">LSK</span>
                </button>
                <div class="center-tools">
                    <a href="../player/" class="ctrl-btn tool-btn" title="Back to CheerpJ Player" style="text-decoration:none;">🎮</a>
                    <button id="btn-room-prev" class="ctrl-btn tool-btn" title="Previous Room">⏪</button>
                    <button id="btn-room-next" class="ctrl-btn tool-btn" title="Next Room">⏩</button>
                </div>
                <button id="btn-rsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F2" aria-label="Right Soft Key">
                    <span>ANIMATE</span>
                    <span class="soft-label-sub">RSK</span>
                </button>
            </div>

            <!-- MAIN GAME CONTROLS: 8-WAY D-PAD (LEFT) + FIRE & *,0,# (RIGHT) -->
            <div class="main-pad-row">
                <!-- 3x3 8-Way D-Pad with Diagonals & Center OK -->
                <div class="dpad-8way-grid">
                    <!-- Row 1: Up-Left, Up, Up-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowLeft" aria-label="Up-Left">↖</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowUp" aria-label="Up">▲</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowRight" aria-label="Up-Right">↗</button>

                    <!-- Row 2: Left, Center OK, Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowLeft" aria-label="Left">◄</button>
                    <button class="ctrl-btn btn-3d dpad-cell dpad-center-ok" data-key="Enter" aria-label="OK">OK</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowRight" aria-label="Right">►</button>

                    <!-- Row 3: Down-Left, Down, Down-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowLeft" aria-label="Down-Left">↙</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowDown" aria-label="Down">▼</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowRight" aria-label="Down-Right">↘</button>
                </div>

                <!-- Right Thumb Action Area -->
                <div class="action-cluster">
                    <!-- Primary 3D Fire / Whip / Select Button -->
                    <button id="btn-fire" class="ctrl-btn btn-3d btn-3d-fire" data-key="Enter" aria-label="Fire / Whip / OK">
                        <span>FIRE</span>
                        <span class="btn-label-sub">WHIP / 5</span>
                    </button>

                    <!-- 3-Key Row: Star (*), Zero (0), Hash (#) -->
                    <div class="key-row-3">
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadAsterisk" aria-label="Star Key">
                            <span>✱</span>
                            <span class="sub-txt">ACT</span>
                        </button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="Digit0" aria-label="Zero Key">
                            <span>0</span>
                            <span class="sub-txt">+</span>
                        </button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadDivide" aria-label="Hash Key">
                            <span>#</span>
                            <span class="sub-txt">SPC</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Graphics } from "./lcd/Graphics.js";
        import { Image } from "./lcd/Image.js";
        import { DataInputStream } from "./io/DataInputStream.js";

        let tile16 = null;
        let tile32 = null;
        let splash = null;
        let allRooms = [];
        let currentRoomIdx = 0;
        let isAnimating = false;
        let jackFrame = 0;
        let animTimer = null;

        // Jack's interactive position in the test room
        let jackX = 104;
        let jackY = 160;

        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const g = new Graphics(ctx, 240, 320);

        async function init() {
            try {
                g.setColor(10, 8, 16);
                g.fillRect(0, 0, 240, 320);

                [tile16, tile32, splash] = await Promise.all([
                    Image.loadFromUrl("../assets/16x16TileSet.png"),
                    Image.loadFromUrl("../assets/32x32TileSet.png"),
                    Image.loadFromUrl("../assets/splash.png")
                ]);

                const levelsRes = await fetch("../assets/levels.mar");
                const buf = await levelsRes.arrayBuffer();
                const dis = new DataInputStream(buf);
                const totalBytes = dis.available();

                const roomCount = Math.floor(totalBytes / 300);
                for (let i = 0; i < roomCount; i++) {
                    const room = new Uint8Array(300);
                    dis.readFully(room);
                    allRooms.push(room);
                }

                renderRoom(0);
                setupListeners();
            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        function renderRoom(idx) {
            currentRoomIdx = (idx + allRooms.length) % allRooms.length;
            const roomData = allRooms[currentRoomIdx];

            // 1. Clear background
            g.setColor(5, 5, 10);
            g.fillRect(0, 0, 240, 320);

            // 2. Render 16x16 background tiles
            const tilesPerRow = Math.floor(tile16.getWidth() / 16); // 20
            for (let r = 0; r < 20; r++) {
                for (let c = 0; c < 15; c++) {
                    const tileIdx = roomData[r * 15 + c];
                    if (tileIdx > 0) {
                        const sx = (tileIdx % tilesPerRow) * 16;
                        const sy = Math.floor(tileIdx / tilesPerRow) * 16;
                        const dx = c * 16;
                        const dy = r * 16;

                        g.setClip(dx, dy, 16, 16);
                        g.drawImage(tile16, dx - sx, dy - sy, 20);
                    }
                }
            }
            g.setClip(0, 0, 240, 320);

            // 3. Render Jack Skellington at interactive coordinates
            renderJack(jackFrame, jackX, jackY);

            // 4. Render Stage HUD text
            g.setColor(245, 158, 11);
            g.drawString(`ROOM ${currentRoomIdx + 1} / ${allRooms.length}`, 8, 8, 20);
            g.setColor(148, 163, 184);
            g.drawString(`USE D-PAD TO MOVE JACK`, 8, 304, 20);
        }

        function renderJack(frame, x, y) {
            const spriteTilesPerRow = Math.floor(tile32.getWidth() / 32); // 13
            const sx = (frame % spriteTilesPerRow) * 32;
            const sy = Math.floor(frame / spriteTilesPerRow) * 32;

            g.setClip(x, y, 32, 32);
            g.drawImage(tile32, x - sx, y - sy, 20);
            g.setClip(0, 0, 240, 320);
        }

        function triggerWhip() {
            // Animate whip attack frames (e.g. frames 12, 13, 14, 15)
            const attackFrames = [12, 13, 14, 15, 8];
            let i = 0;
            const whipInterval = setInterval(() => {
                if (i < attackFrames.length) {
                    jackFrame = attackFrames[i++];
                    renderRoom(currentRoomIdx);
                } else {
                    clearInterval(whipInterval);
                }
            }, 70);
        }

        function moveJack(dx, dy) {
            jackX = Math.max(0, Math.min(240 - 32, jackX + dx));
            jackY = Math.max(0, Math.min(320 - 32, jackY + dy));
            jackFrame = (jackFrame + 1) % 8;
            renderRoom(currentRoomIdx);
        }

        function setupListeners() {
            // Room buttons
            document.getElementById("btn-room-next").addEventListener("click", () => renderRoom(currentRoomIdx + 1));
            document.getElementById("btn-room-prev").addEventListener("click", () => renderRoom(currentRoomIdx - 1));
            document.getElementById("btn-lsk").addEventListener("click", () => renderRoom(currentRoomIdx + 1));

            // Animate button
            const rskBtn = document.getElementById("btn-rsk");
            rskBtn.addEventListener("click", () => {
                isAnimating = !isAnimating;
                rskBtn.querySelector("span").textContent = isAnimating ? "STOP" : "ANIMATE";
                if (isAnimating) {
                    animTimer = setInterval(() => {
                        jackFrame = (jackFrame + 1) % 24;
                        renderRoom(currentRoomIdx);
                    }, 100);
                } else {
                    clearInterval(animTimer);
                }
            });

            // Whip button
            document.getElementById("btn-fire").addEventListener("click", triggerWhip);

            // On-screen touch D-Pad
            const buttons = document.querySelectorAll(".ctrl-btn");
            buttons.forEach(btn => {
                const handleAction = () => {
                    const key = btn.dataset.key;
                    if (!key) return;

                    if (key.includes("ArrowLeft")) moveJack(-8, 0);
                    if (key.includes("ArrowRight")) moveJack(8, 0);
                    if (key.includes("ArrowUp")) moveJack(0, -8);
                    if (key.includes("ArrowDown")) moveJack(0, 8);
                    if (key === "Enter") triggerWhip();
                };

                btn.addEventListener("touchstart", (e) => {
                    e.preventDefault();
                    btn.classList.add("active");
                    handleAction();
                    try { if (navigator.vibrate) navigator.vibrate(10); } catch(e) {}
                }, { passive: false });

                btn.addEventListener("touchend", () => btn.classList.remove("active"));
                btn.addEventListener("touchcancel", () => btn.classList.remove("active"));
                btn.addEventListener("mousedown", () => {
                    btn.classList.add("active");
                    handleAction();
                });
                btn.addEventListener("mouseup", () => btn.classList.remove("active"));
            });

            // Keyboard listeners
            window.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") moveJack(-8, 0);
                else if (e.key === "ArrowRight") moveJack(8, 0);
                else if (e.key === "ArrowUp") moveJack(0, -8);
                else if (e.key === "ArrowDown") moveJack(0, 8);
                else if (e.key === "Enter" || e.key === " ") triggerWhip();
            });
        }

        init();
    </script>
</body>
</html>
