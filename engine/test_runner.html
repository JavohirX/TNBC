<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nightmare Before Christmas - Pure JS Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e2ec;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0d0e15;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        #header {
            padding: 10px 14px;
            background: #141724;
            border-bottom: 1px solid #232638;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f59e0b;
            letter-spacing: 0.5px;
        }

        .tag {
            font-size: 0.7rem;
            background: #22c55e;
            color: #052e16;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        #screen-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #232635;
            flex-shrink: 0;
        }

        #screen-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: 52vh;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #08090d;
        }

        /* --- 3D TACTILE RETRO CONTROLS --- */
        .mobile-controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 10px 14px;
            background: radial-gradient(circle at 50% 15%, #181b29 0%, #0a0b12 100%);
            border-top: 1px solid #292d3f;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Base 3D Tactile Button */
        .btn-3d {
            position: relative;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Slate 3D Keycap */
        .btn-3d-dark {
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #e2e8f0;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* Mechanical Button Pressed Animation */
        .btn-3d-dark:active, .btn-3d-dark.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(56, 189, 248, 0.4);
            background: linear-gradient(180deg, #222636 0%, #161824 100%);
            color: #38bdf8;
        }

        /* TOP SOFTKEYS */
        .softkey-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .btn-3d-soft {
            flex: 1.2;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(180deg, #444b68 0%, #2b3046 50%, #1e2232 100%);
            color: #f1f5f9;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 4px 0 #0c0e16,
                0 6px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-3d-soft:active, .btn-3d-soft.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #0c0e16,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(245, 158, 11, 0.5);
            background: linear-gradient(180deg, #222636 0%, #171924 100%);
            color: #f59e0b;
        }

        .soft-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .center-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #0f111a;
            padding: 3px 6px;
            border-radius: 16px;
            border: 1px solid #232738;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9em;
            background: linear-gradient(180deg, #2a2e40 0%, #1a1c29 100%);
            border: 1px solid #33384e;
            color: #94a3b8;
            box-shadow: 0 2px 0 #0c0d15;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #0c0d15;
            color: #f59e0b;
        }

        /* --- MAIN PAD AREA --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            padding: 2px 4px;
        }

        /* 3x3 8-WAY D-PAD WITH DIAGONALS & CENTER OK */
        .dpad-8way-grid {
            width: 154px;
            height: 154px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: #11131e;
            padding: 5px;
            border-radius: 20px;
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .dpad-cell {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            font-weight: 800;
        }

        .dpad-cardinal {
            font-size: 1.35em;
            color: #f8fafc;
        }

        .dpad-diagonal {
            font-size: 1.15em;
            color: #7dd3fc;
            background: linear-gradient(180deg, #2a2e42 0%, #1c1f2e 100%);
            border-radius: 6px;
        }

        .dpad-diagonal:active, .dpad-diagonal.active {
            color: #38bdf8;
            background: linear-gradient(180deg, #1f2333 0%, #131520 100%);
        }

        .dpad-center-ok {
            background: linear-gradient(180deg, #443c2c 0%, #2e281b 50%, #1f1b12 100%);
            color: #fbbf24;
            font-size: 0.88em;
            border-radius: 6px;
            border-top: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 
                0 4px 0 #120f09,
                0 5px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .dpad-center-ok:active, .dpad-center-ok.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #120f09,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(251, 191, 36, 0.5);
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            color: #fff;
        }

        /* --- RIGHT ACTION AREA (FIRE + *, 0, # CLUSTER) --- */
        .action-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-right: 2px;
        }

        .btn-3d-fire {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(180deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
            color: #fff;
            font-size: 0.95em;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 5px 0 #7c2d12,
                0 8px 16px rgba(234, 88, 12, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-3d-fire:active, .btn-3d-fire.active {
            transform: translateY(4px);
            box-shadow: 
                0 1px 0 #7c2d12,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 6px rgba(0, 0, 0, 0.6),
                0 0 18px rgba(249, 115, 22, 0.7);
            background: linear-gradient(180deg, #c2410c 0%, #9a3412 100%);
        }

        .btn-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .key-row-3 {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .btn-3d-trio {
            width: 44px;
            height: 44px;
            border-radius: 9px;
            font-size: 1.15em;
            font-weight: 800;
        }

        .btn-3d-trio .sub-txt {
            font-size: 0.52em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 0;
            line-height: 1;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="header">
            <span class="title">Nightmare Before Christmas</span>
            <span class="tag">Pure JS • 60 FPS</span>
        </div>

        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="game-canvas" width="240" height="320"></canvas>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (3D RETRO PHONE) -->
        <div class="mobile-controls-panel">
            <!-- TOP SOFTKEYS -->
            <div class="softkey-row">
                <button id="btn-lsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F1" aria-label="Left Soft Key">
                    <span>STAGE</span>
                    <span class="soft-label-sub">LSK</span>
                </button>
                <div class="center-tools">
                    <a href="../player/" class="ctrl-btn tool-btn" title="CheerpJ Player" style="text-decoration:none;">🎮</a>
                    <button id="btn-room-prev" class="ctrl-btn tool-btn" title="Previous Room">⏪</button>
                    <button id="btn-room-next" class="ctrl-btn tool-btn" title="Next Room">⏩</button>
                </div>
                <button id="btn-rsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F2" aria-label="Right Soft Key">
                    <span>WHIP</span>
                    <span class="soft-label-sub">RSK</span>
                </button>
            </div>

            <!-- MAIN GAME CONTROLS: 8-WAY D-PAD (LEFT) + FIRE & *,0,# (RIGHT) -->
            <div class="main-pad-row">
                <!-- 3x3 8-Way D-Pad with Diagonals & Center OK -->
                <div class="dpad-8way-grid">
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowLeft" aria-label="Up-Left">↖</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowUp" aria-label="Up">▲</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowRight" aria-label="Up-Right">↗</button>

                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowLeft" aria-label="Left">◄</button>
                    <button id="btn-mid-ok" class="ctrl-btn btn-3d dpad-cell dpad-center-ok" data-key="Enter" aria-label="OK">OK</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowRight" aria-label="Right">►</button>

                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowLeft" aria-label="Down-Left">↙</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowDown" aria-label="Down">▼</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowRight" aria-label="Down-Right">↘</button>
                </div>

                <!-- Right Thumb Action Area -->
                <div class="action-cluster">
                    <button id="btn-fire" class="ctrl-btn btn-3d btn-3d-fire" data-key="Enter" aria-label="Fire / Whip / OK">
                        <span>FIRE</span>
                        <span class="btn-label-sub">WHIP / 5</span>
                    </button>

                    <div class="key-row-3">
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadAsterisk" aria-label="Star Key">
                            <span>✱</span>
                            <span class="sub-txt">ACT</span>
                        </button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="Digit0" aria-label="Zero Key">
                            <span>0</span>
                            <span class="sub-txt">+</span>
                        </button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadDivide" aria-label="Hash Key">
                            <span>#</span>
                            <span class="sub-txt">SPC</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { DataInputStream } from "./io/DataInputStream.js";

        // Living Mobile Authentic Engine Dimensions
        const ROOM_COLS = 11;
        const ROOM_ROWS = 12;
        const ROOM_BYTES = ROOM_COLS * ROOM_ROWS; // 132 bytes per room!
        const TILE_SIZE = 20;                     // t.var_int_c = 20!
        const SPRITE_SIZE = 37;                   // t.var_int_d = 37!

        const TILESET_COLS = 16;                  // 320 / 20 = 16
        const SPRITESET_COLS = 12;                // 446 / 37 = 12

        const OFFSET_X = Math.floor((240 - ROOM_COLS * TILE_SIZE) / 2); // 10px
        const OFFSET_Y = 40;                                            // 40px

        // Living Mobile exact tile id map from r.d(x, y, code)
        const TILE_MAP = {
            0: 188,  // Clear floor path
            3: 58,   // Spikes
            4: 187,  // Wall variant
            5: 171,  // Cobblestone solid wall
            6: 59,   // Wall edge
            7: 60,   // Wall corner
            22: 86,  // Item / Key / Door
            28: 155, // Stone platform
            32: 221  // Exit / Gift bag
        };

        let tileImg = new Image();
        let spriteImg = new Image();
        let allRooms = [];
        let currentRoomIdx = 0;

        let jackX = 72;
        let jackY = 63;
        let jackFrame = 8;
        let isAttacking = false;
        let jackFacingLeft = false;

        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        async function init() {
            try {
                await Promise.all([
                    loadImage(tileImg, "../assets/16x16TileSet.png"),
                    loadImage(spriteImg, "../assets/32x32TileSet.png")
                ]);

                // Read levels.mar (13,200 bytes = 100 rooms of 132 bytes)
                const res = await fetch("../assets/levels.mar");
                const buf = await res.arrayBuffer();
                const dis = new DataInputStream(buf);
                const totalRooms = Math.floor(dis.available() / ROOM_BYTES);

                for (let i = 0; i < totalRooms; i++) {
                    const room = new Uint8Array(ROOM_BYTES);
                    dis.readFully(room);
                    allRooms.push(room);
                }

                loadRoom(0);
                setupInput();
                requestAnimationFrame(gameLoop);
            } catch (err) {
                console.error("Init Error:", err);
            }
        }

        function loadImage(img, src) {
            return new Promise((resolve, reject) => {
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function loadRoom(idx) {
            currentRoomIdx = (idx + allRooms.length) % allRooms.length;
            const roomData = allRooms[currentRoomIdx];

            // Scan for Jack's initial spawn point (code 29)
            for (let i = 0; i < ROOM_BYTES; i++) {
                if (roomData[i] === 29) {
                    const c = i % ROOM_COLS;
                    const r = Math.floor(i / ROOM_COLS);
                    jackX = OFFSET_X + c * TILE_SIZE - 8;
                    jackY = OFFSET_Y + r * TILE_SIZE - 17;
                    break;
                }
            }
        }

        function render() {
            // 1. Dark cemetery background
            ctx.fillStyle = "#08090d";
            ctx.fillRect(0, 0, 240, 320);

            const roomData = allRooms[currentRoomIdx];
            if (!roomData) return;

            // 2. Render 20x20 Tiles with direct pixel blitting
            for (let i = 0; i < ROOM_BYTES; i++) {
                let code = roomData[i];
                if (code === 29) code = 0; // Air under Jack spawn

                const c = i % ROOM_COLS;
                const r = Math.floor(i / ROOM_COLS);
                const dx = OFFSET_X + c * TILE_SIZE;
                const dy = OFFSET_Y + r * TILE_SIZE;

                const tileId = TILE_MAP[code] !== undefined ? TILE_MAP[code] : (code > 7 ? 188 : 171);

                const sx = (tileId % TILESET_COLS) * TILE_SIZE;
                const sy = Math.floor(tileId / TILESET_COLS) * TILE_SIZE;

                ctx.drawImage(tileImg, sx, sy, TILE_SIZE, TILE_SIZE, dx, dy, TILE_SIZE, TILE_SIZE);
            }

            // 3. Render Jack Skellington (37x37 sprite)
            const jx = (jackFrame % SPRITESET_COLS) * SPRITE_SIZE;
            const jy = Math.floor(jackFrame / SPRITESET_COLS) * SPRITE_SIZE;

            ctx.save();
            if (jackFacingLeft) {
                ctx.translate(jackX + SPRITE_SIZE, jackY);
                ctx.scale(-1, 1);
                ctx.drawImage(spriteImg, jx, jy, SPRITE_SIZE, SPRITE_SIZE, 0, 0, SPRITE_SIZE, SPRITE_SIZE);
            } else {
                ctx.drawImage(spriteImg, jx, jy, SPRITE_SIZE, SPRITE_SIZE, jackX, jackY, SPRITE_SIZE, SPRITE_SIZE);
            }
            ctx.restore();

            // 4. Clean Retro HUD Header
            ctx.fillStyle = "#f59e0b";
            ctx.font = "bold 11px monospace";
            ctx.fillText(`STAGE: ${currentRoomIdx + 1} / ${allRooms.length}`, 12, 22);

            ctx.fillStyle = "#94a3b8";
            ctx.font = "10px monospace";
            ctx.fillText("HALLOWEEN TOWN • 240x320", 12, 34);

            // Bottom guide
            ctx.fillStyle = "#64748b";
            ctx.fillText("D-PAD: MOVE • FIRE: WHIP ATTACK", 12, 304);
        }

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        function triggerWhip() {
            if (isAttacking) return;
            isAttacking = true;
            // Jack's whip animation sequence in 32x32TileSet
            const frames = [12, 13, 14, 15, 8];
            let step = 0;
            const whipInterval = setInterval(() => {
                if (step < frames.length) {
                    jackFrame = frames[step++];
                } else {
                    clearInterval(whipInterval);
                    jackFrame = 8;
                    isAttacking = false;
                }
            }, 65);
        }

        function moveJack(dx, dy) {
            if (isAttacking) return;
            if (dx < 0) jackFacingLeft = true;
            if (dx > 0) jackFacingLeft = false;

            const newX = jackX + dx;
            const newY = jackY + dy;

            // Constrain inside room bounds
            jackX = Math.max(OFFSET_X - 6, Math.min(OFFSET_X + ROOM_COLS * TILE_SIZE - SPRITE_SIZE + 6, newX));
            jackY = Math.max(OFFSET_Y - 10, Math.min(OFFSET_Y + ROOM_ROWS * TILE_SIZE - SPRITE_SIZE + 6, newY));

            // Walk animation
            jackFrame = jackFrame === 8 ? 9 : 8;
        }

        function setupInput() {
            // Stage navigation buttons
            document.getElementById("btn-room-next").addEventListener("click", () => loadRoom(currentRoomIdx + 1));
            document.getElementById("btn-room-prev").addEventListener("click", () => loadRoom(currentRoomIdx - 1));
            document.getElementById("btn-lsk").addEventListener("click", () => loadRoom(currentRoomIdx + 1));
            document.getElementById("btn-rsk").addEventListener("click", triggerWhip);

            // Whip buttons
            document.getElementById("btn-fire").addEventListener("click", triggerWhip);
            document.getElementById("btn-mid-ok").addEventListener("click", triggerWhip);

            // D-Pad and keypad touch controls
            const buttons = document.querySelectorAll(".ctrl-btn");
            buttons.forEach(btn => {
                const handleKey = () => {
                    const key = btn.dataset.key;
                    if (!key) return;

                    const keys = key.split(",");
                    let dx = 0;
                    let dy = 0;

                    for (const k of keys) {
                        if (k.trim() === "ArrowLeft") dx -= 8;
                        if (k.trim() === "ArrowRight") dx += 8;
                        if (k.trim() === "ArrowUp") dy -= 8;
                        if (k.trim() === "ArrowDown") dy += 8;
                        if (k.trim() === "Enter") triggerWhip();
                    }

                    if (dx !== 0 || dy !== 0) moveJack(dx, dy);
                };

                btn.addEventListener("touchstart", (e) => {
                    e.preventDefault();
                    btn.classList.add("active");
                    handleKey();
                    try { if (navigator.vibrate) navigator.vibrate(10); } catch(e) {}
                }, { passive: false });

                btn.addEventListener("touchend", () => btn.classList.remove("active"));
                btn.addEventListener("touchcancel", () => btn.classList.remove("active"));

                btn.addEventListener("mousedown", () => {
                    btn.classList.add("active");
                    handleKey();
                });
                btn.addEventListener("mouseup", () => btn.classList.remove("active"));
            });

            // Physical Keyboard support
            window.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft" || e.key === "a") moveJack(-8, 0);
                else if (e.key === "ArrowRight" || e.key === "d") moveJack(8, 0);
                else if (e.key === "ArrowUp" || e.key === "w") moveJack(0, -8);
                else if (e.key === "ArrowDown" || e.key === "s") moveJack(0, 8);
                else if (e.key === "Enter" || e.key === " ") triggerWhip();
            });
        }

        init();
    </script>
</body>
</html>
