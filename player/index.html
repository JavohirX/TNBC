<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>The Nightmare Before Christmas - Mobile Player</title>
    <!-- Telegram Mini App WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #e0e2ec;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #0d0e15;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- SCREEN CONTAINER: PRESERVES 3:4 RATIO & FITS BY WIDTH --- */
        #screen-wrapper {
            width: 100%;
            flex: 0 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #232635;
            overflow: hidden;
        }

        #screen-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: calc(100dvh - 215px);
            max-width: calc((100dvh - 215px) * 0.75);
            margin: 0 auto;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #display {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #000;
        }

        #display:focus {
            outline: none;
        }

        /* --- MINIMALISTIC HALLOWEEN SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #08090d;
            z-index: 99999;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dev-logo {
            width: 140px;
            max-width: 50vw;
            height: auto;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            filter: drop-shadow(0 0 16px rgba(249, 115, 22, 0.45));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }

        .progress-bar-wrap {
            width: 140px;
            max-width: 50vw;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            margin-top: 28px;
            overflow: hidden;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #f97316;
            border-radius: 2px;
            transition: width 0.15s ease-out;
            box-shadow: 0 0 8px rgba(249, 115, 22, 0.8);
        }

        /* --- 3D TACTILE RETRO CONTROLS PANEL --- */
        .mobile-controls-panel {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: radial-gradient(circle at 50% 15%, #181b29 0%, #0a0b12 100%);
            border-top: 1px solid #292d3f;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Base 3D Tactile Button */
        .btn-3d {
            position: relative;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Slate 3D Keycap */
        .btn-3d-dark {
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #e2e8f0;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* 3D Button Mechanically Pressed Animation */
        .btn-3d-dark:active, .btn-3d-dark.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(56, 189, 248, 0.4);
            background: linear-gradient(180deg, #222636 0%, #161824 100%);
            color: #38bdf8;
        }

        /* --- TOP SOFTKEY ROW (NOKIA TOP-LEFT & TOP-RIGHT) --- */
        .softkey-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        /* Classic Nokia Horizontal Soft Keys */
        .btn-3d-soft {
            flex: 1.2;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(180deg, #444b68 0%, #2b3046 50%, #1e2232 100%);
            color: #f1f5f9;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 4px 0 #0c0e16,
                0 6px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-3d-soft:active, .btn-3d-soft.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #0c0e16,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(245, 158, 11, 0.5);
            background: linear-gradient(180deg, #222636 0%, #171924 100%);
            color: #f59e0b;
        }

        .soft-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .center-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #0f111a;
            padding: 3px 6px;
            border-radius: 16px;
            border: 1px solid #232738;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9em;
            background: linear-gradient(180deg, #2a2e40 0%, #1a1c29 100%);
            border: 1px solid #33384e;
            color: #94a3b8;
            box-shadow: 0 2px 0 #0c0d15;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
        }

        .tool-btn:active, .tool-btn.active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #0c0d15;
            color: #f59e0b;
        }

        .tool-btn.muted {
            color: #ef4444;
            border-color: #ef4444;
        }

        .game-toast {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(13, 14, 21, 0.95);
            border: 1px solid #f59e0b;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .game-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- MAIN PAD AREA (8-WAY D-PAD + ACTION CLUSTER) --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            padding: 2px 4px;
        }

        /* 3x3 8-WAY D-PAD WITH DIAGONALS & PIVOT HUB */
        .dpad-8way-grid {
            width: 154px;
            height: 154px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: #11131e;
            padding: 5px;
            border-radius: 20px;
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 2px 6px rgba(0, 0, 0, 0.7);
            touch-action: none;
        }

        .dpad-cell {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            font-weight: 800;
            touch-action: none;
        }

        /* Cardinal Direction Arrows (▲, ▼, ◄, ►) */
        .dpad-cardinal {
            font-size: 1.35em;
            color: #f8fafc;
        }

        /* Diagonal Direction Arrows (↖, ↗, ↙, ↘) */
        .dpad-diagonal {
            font-size: 1.15em;
            color: #7dd3fc;
            background: linear-gradient(180deg, #2a2e42 0%, #1c1f2e 100%);
            border-radius: 6px;
        }

        .dpad-diagonal:active, .dpad-diagonal.active {
            color: #38bdf8;
            background: linear-gradient(180deg, #1f2333 0%, #131520 100%);
        }

        /* D-Pad Center Pivot Hub (neutral dead-zone) */
        .dpad-center-hub {
            background: radial-gradient(circle at center, #1c1f2e 0%, #11131e 100%);
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.75);
            pointer-events: none;
        }

        /* --- RIGHT ACTION AREA (OK + *, 0, # CLUSTER) --- */
        .action-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-right: 2px;
        }

        /* 3D Action / OK Button - Matches dark slate keycap aesthetic */
        .btn-3d-fire {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #f1f5f9;
            font-size: 1.2em;
            font-weight: 800;
            letter-spacing: 0.8px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 12px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-3d-fire:active, .btn-3d-fire.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(56, 189, 248, 0.45);
            background: linear-gradient(180deg, #222636 0%, #161824 100%);
            color: #38bdf8;
        }

        /* 3-Key Horizontal Row for *, 0, # */
        .key-row-3 {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .btn-3d-trio {
            width: 44px;
            height: 44px;
            border-radius: 9px;
            font-size: 1.15em;
            font-weight: 800;
        }

        /* Small screens */
        @media (max-width: 350px) {
            .dpad-8way-grid {
                width: 136px;
                height: 136px;
                gap: 3px;
                padding: 4px;
            }
            .btn-3d-fire {
                width: 62px;
                height: 62px;
                font-size: 0.88em;
            }
            .btn-3d-trio {
                width: 38px;
                height: 38px;
            }
        }

        /* Landscape adjustments if rotated */
        @media (orientation: landscape) {
            #app-container {
                max-width: 100%;
                max-height: 100%;
                flex-direction: row;
                border-radius: 0;
            }
            #screen-wrapper {
                height: 100%;
                width: auto;
                max-height: 100%;
                flex: 0 0 auto;
                border-bottom: none;
                border-right: 2px solid #232635;
            }
            #screen-container {
                height: 100%;
                width: auto;
                aspect-ratio: 3 / 4;
                max-height: 100%;
                max-width: calc(100vh * 0.75);
            }
            .mobile-controls-panel {
                flex: 1;
                height: 100%;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <!-- MINIMALISTIC HALLOWEEN SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="../assets/dev_logo.png" onerror="this.onerror=null;this.src='dev_logo.png'" alt="Developer Logo" class="dev-logo" width="170" height="142">
            <div class="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <!-- 3:4 SCREEN CONTAINER (FIT BY WIDTH) -->
        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="display" tabindex="0"></canvas>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (3D RETRO PHONE) -->
        <div class="mobile-controls-panel">
            <!-- TOP SOFTKEYS (NOKIA TOP-LEFT & TOP-RIGHT) -->
            <div class="softkey-row">
                <button id="btn-lsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F1" aria-label="Left Soft Key">
                    <span>OPTIONS</span>
                    <span class="soft-label-sub">LSK</span>
                </button>
                <div class="center-tools">
                    <button id="btn-mute" class="ctrl-btn tool-btn" title="Toggle Sound (or press M)">🔊</button>
                    <button id="btn-reset" class="ctrl-btn tool-btn" title="Restart Game">⟲</button>
                </div>
                <button id="btn-rsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F2" aria-label="Right Soft Key">
                    <span>BACK</span>
                    <span class="soft-label-sub">RSK</span>
                </button>
            </div>

            <!-- MAIN GAME CONTROLS: 8-WAY D-PAD (LEFT) + OK & *,0,# (RIGHT) -->
            <div class="main-pad-row">
                <!-- 3x3 8-Way D-Pad with Diagonals & Center Pivot Hub -->
                <div class="dpad-8way-grid" id="dpad-grid">
                    <!-- Row 1: Up-Left, Up, Up-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowLeft" data-dir="up-left" aria-label="Up-Left">↖</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowUp" data-dir="up" aria-label="Up">▲</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowRight" data-dir="up-right" aria-label="Up-Right">↗</button>

                    <!-- Row 2: Left, Center Pivot Hub, Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowLeft" data-dir="left" aria-label="Left">◄</button>
                    <div class="dpad-cell dpad-center-hub" aria-hidden="true"></div>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowRight" data-dir="right" aria-label="Right">►</button>

                    <!-- Row 3: Down-Left, Down, Down-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowLeft" data-dir="down-left" aria-label="Down-Left">↙</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowDown" data-dir="down" aria-label="Down">▼</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowRight" data-dir="down-right" aria-label="Down-Right">↘</button>
                </div>

                <!-- Right Thumb Action Area -->
                <div class="action-cluster">
                    <!-- Primary 3D OK Button -->
                    <button class="ctrl-btn btn-3d btn-3d-fire" data-key="Enter" aria-label="OK">
                        <span>OK</span>
                    </button>

                    <!-- 3-Key Row: Star (*), Zero (0), Hash (#) -->
                    <div class="key-row-3">
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadAsterisk" aria-label="Star Key">✱</button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="Digit0" aria-label="Zero Key">0</button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadDivide" aria-label="Hash Key">#</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 100% Pure Native JavaScript Engine Entrypoint -->
    <script type="module">
        window.addEventListener('error', (e) => console.error("Global Error:", e.message, e.filename, e.lineno, e.error));
        window.addEventListener('unhandledrejection', (e) => console.error("Unhandled Rejection:", e.reason));

        // Telegram Mini App Auto-Ready & Expanded Mode (middle mode)
        function initTelegramWebApp() {
            if (!window.Telegram?.WebApp) return;
            try {
                const tg = window.Telegram.WebApp;
                tg.ready();

                // 1. Expand to maximum height while preserving standard Telegram navigation header
                tg.expand();

                // 2. Disable vertical swipes to prevent pull-to-close dismiss during game taps
                if (typeof tg.disableVerticalSwipes === 'function') {
                    try { tg.disableVerticalSwipes(); } catch (_) {}
                }

                // 3. Lock orientation to portrait if supported
                if (typeof tg.lockOrientation === 'function') {
                    try { tg.lockOrientation('portrait'); } catch (_) {}
                }

                // 4. Immersive theme colors
                try {
                    if (tg.setHeaderColor) tg.setHeaderColor("#08090d");
                    if (tg.setBackgroundColor) tg.setBackgroundColor("#08090d");
                    if (tg.setBottomBarColor) tg.setBottomBarColor("#08090d");
                } catch (_) {}

                // 5. Viewport change safety handler: keep expanded
                tg.onEvent?.('viewportChanged', () => {
                    if (!tg.isExpanded) {
                        try { tg.expand(); } catch (_) {}
                    }
                });

                console.log("Telegram Mini App SDK loaded in Expanded Mode (top navigation header preserved)!");
            } catch (tgErr) {
                console.warn("Telegram WebApp init warning:", tgErr);
            }
        }

        initTelegramWebApp();

        // Safety handler: Ensure expanded on first user gesture without forcing full-screen takeover
        const ensureExpandedOnGesture = () => {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                if (!tg.isExpanded) {
                    try { tg.expand(); } catch (_) {}
                }
            }
        };
        window.addEventListener('pointerdown', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('touchstart', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('click', ensureExpandedOnGesture, { passive: true });

        // Explicit cache buster to guarantee fresh asset loading across mobile/TMA webviews
        const APP_BUILD_HASH = "v20261022_b9";
        import(`../engine/main.js?v=${APP_BUILD_HASH}`).then(({ startNativeEngine }) => {
            return startNativeEngine(`../assets/`, APP_BUILD_HASH);
        }).catch(err => {
            console.error("Engine Start Error:", err);
            window.__lastErr = err.message + '\n' + err.stack;
        });
    </script>
</body>
</html>
