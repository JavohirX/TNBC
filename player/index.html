<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>The Nightmare Before Christmas - Mobile Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #e0e2ec;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 920px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #0d0e15;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
        }

        /* --- SCREEN CONTAINER: PRESERVES 3:4 RATIO & FITS BY WIDTH --- */
        #screen-wrapper {
            width: 100%;
            flex: 0 1 auto;
            max-height: 52%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #232635;
        }

        #screen-container {
            height: 100%;
            aspect-ratio: 3 / 4;
            max-width: 100%;
            max-height: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #display {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: none;
            background-color: #000;
        }

        #display:focus {
            outline: none;
        }

        /* --- LOADING & SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a162b 0%, #08070e 100%);
            color: #d8b4fe;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .title-badge {
            font-size: 1.15em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #f59e0b;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .subtitle-badge {
            font-size: 0.85em;
            color: #a78bfa;
            margin-bottom: 20px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(167, 139, 250, 0.2);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .progress-bar-wrap {
            width: 82%;
            max-width: 250px;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            margin: 12px 0 6px 0;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        #progress-bar-fill {
            width: 5%;
            height: 100%;
            background: linear-gradient(90deg, #f59e0b 0%, #ef4444 50%, #8b5cf6 100%);
            border-radius: 3px;
            transition: width 0.4s ease;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
        }

        #loading-timer {
            font-size: 0.76em;
            color: #fbbf24;
            font-family: monospace;
            margin-top: 4px;
        }

        /* --- LOWER MOBILE CONTROLS PANEL --- */
        .mobile-controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 14px 16px 14px;
            background: linear-gradient(180deg, #13151f 0%, #0a0b10 100%);
            touch-action: none;
            position: relative;
        }

        /* Soft Keys & Toolbar Row */
        .softkey-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        /* --- 3D TACTILE RETRO CONTROLS --- */
        .mobile-controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 10px 14px;
            background: radial-gradient(circle at 50% 15%, #181b29 0%, #0a0b12 100%);
            border-top: 1px solid #292d3f;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Base 3D Tactile Button */
        .btn-3d {
            position: relative;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Slate 3D Keycap */
        .btn-3d-dark {
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #e2e8f0;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* 3D Button Mechanically Pressed Animation */
        .btn-3d-dark:active, .btn-3d-dark.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(56, 189, 248, 0.4);
            background: linear-gradient(180deg, #222636 0%, #161824 100%);
            color: #38bdf8;
        }

        /* --- TOP SOFTKEY ROW (NOKIA TOP-LEFT & TOP-RIGHT) --- */
        .softkey-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        /* Classic Nokia Horizontal Soft Keys */
        .btn-3d-soft {
            flex: 1.2;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(180deg, #444b68 0%, #2b3046 50%, #1e2232 100%);
            color: #f1f5f9;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 4px 0 #0c0e16,
                0 6px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-3d-soft:active, .btn-3d-soft.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #0c0e16,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(245, 158, 11, 0.5);
            background: linear-gradient(180deg, #222636 0%, #171924 100%);
            color: #f59e0b;
        }

        .soft-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .center-tools {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #0f111a;
            padding: 3px 6px;
            border-radius: 16px;
            border: 1px solid #232738;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9em;
            background: linear-gradient(180deg, #2a2e40 0%, #1a1c29 100%);
            border: 1px solid #33384e;
            color: #94a3b8;
            box-shadow: 0 2px 0 #0c0d15;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
        }

        .tool-btn:active, .tool-btn.active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #0c0d15;
            color: #f59e0b;
        }

        .tool-btn.muted {
            color: #ef4444;
            border-color: #ef4444;
        }

        /* --- MAIN PAD AREA (8-WAY D-PAD + ACTION CLUSTER) --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            padding: 2px 4px;
        }

        /* 3x3 8-WAY D-PAD WITH DIAGONALS & CENTER OK */
        .dpad-8way-grid {
            width: 154px;
            height: 154px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            background: #11131e;
            padding: 5px;
            border-radius: 20px;
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .dpad-cell {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            font-weight: 800;
        }

        /* Cardinal Direction Arrows (▲, ▼, ◄, ►) */
        .dpad-cardinal {
            font-size: 1.35em;
            color: #f8fafc;
        }

        /* Diagonal Direction Arrows (↖, ↗, ↙, ↘) */
        .dpad-diagonal {
            font-size: 1.15em;
            color: #7dd3fc;
            background: linear-gradient(180deg, #2a2e42 0%, #1c1f2e 100%);
            border-radius: 6px;
        }

        .dpad-diagonal:active, .dpad-diagonal.active {
            color: #38bdf8;
            background: linear-gradient(180deg, #1f2333 0%, #131520 100%);
        }

        /* Center OK Button */
        .dpad-center-ok {
            background: linear-gradient(180deg, #443c2c 0%, #2e281b 50%, #1f1b12 100%);
            color: #fbbf24;
            font-size: 0.88em;
            border-radius: 6px;
            border-top: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 
                0 4px 0 #120f09,
                0 5px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .dpad-center-ok:active, .dpad-center-ok.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #120f09,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(251, 191, 36, 0.5);
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            color: #fff;
        }

        /* --- RIGHT ACTION AREA (FIRE + *, 0, # CLUSTER) --- */
        .action-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding-right: 2px;
        }

        /* Big 3D FIRE / WHIP Button */
        .btn-3d-fire {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(180deg, #f97316 0%, #ea580c 50%, #c2410c 100%);
            color: #fff;
            font-size: 0.95em;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 5px 0 #7c2d12,
                0 8px 16px rgba(234, 88, 12, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-3d-fire:active, .btn-3d-fire.active {
            transform: translateY(4px);
            box-shadow: 
                0 1px 0 #7c2d12,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 6px rgba(0, 0, 0, 0.6),
                0 0 18px rgba(249, 115, 22, 0.7);
            background: linear-gradient(180deg, #c2410c 0%, #9a3412 100%);
        }

        .btn-label-sub {
            font-size: 0.62em;
            font-weight: 600;
            opacity: 0.9;
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        /* 3-Key Horizontal Row for *, 0, # */
        .key-row-3 {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .btn-3d-trio {
            width: 44px;
            height: 44px;
            border-radius: 9px;
            font-size: 1.15em;
            font-weight: 800;
        }

        .btn-3d-trio .sub-txt {
            font-size: 0.52em;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 0;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        /* --- COLLAPSIBLE NUMERIC KEYPAD DRAWER --- */
        #num-keypad {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 6px;
            background: #141724;
            border: 2px solid #373b4e;
            border-radius: 12px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.8);
            z-index: 20;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }

        #num-keypad.hidden {
            transform: translateY(110%);
            opacity: 0;
            pointer-events: none;
        }

        .num-btn {
            height: 42px;
            font-size: 1.15em;
            border-radius: 8px;
            background: #232737;
            border-color: #383e54;
        }

        .num-btn span {
            font-size: 0.5em;
            color: #94a3b8;
            margin-left: 4px;
        }

        /* Landscape adjustments if rotated */
        @media (orientation: landscape) and (max-height: 500px) {
            #app-container {
                max-width: 100%;
                flex-direction: row;
                border-radius: 0;
            }
            #screen-wrapper {
                height: 100%;
                width: auto;
                max-height: 100%;
                flex: 0 0 auto;
                border-bottom: none;
                border-right: 2px solid #232635;
            }
            #screen-container {
                height: 100%;
                width: auto;
                max-height: 100%;
            }
            .mobile-controls-panel {
                flex: 1;
                height: 100%;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 3:4 SCREEN CONTAINER (FIT BY WIDTH) -->
        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="display" tabindex="0"></canvas>
                <div id="splash-screen">
                    <div class="title-badge">Nightmare Before Christmas</div>
                    <div class="subtitle-badge">Living Mobile &bull; J2ME 240&times;320</div>
                    <div class="spinner"></div>
                    <div id="loading-text">Initializing Audio & Engine...</div>
                    <div class="progress-bar-wrap">
                        <div id="progress-bar-fill"></div>
                    </div>
                    <div id="loading-timer">Booting JVM... (0s)</div>
                    <div id="loading-subtext" style="font-size: 0.76em; color: #94a3b8; margin-top: 8px; max-width: 280px; line-height: 1.4;">First launch compiles WebAssembly runtime (~45-60s). Subsequent launches will load instantly from browser cache.</div>
                </div>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (3D RETRO PHONE) -->
        <div class="mobile-controls-panel">
            <!-- TOP SOFTKEYS (NOKIA TOP-LEFT & TOP-RIGHT) -->
            <div class="softkey-row">
                <button id="btn-lsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F1" aria-label="Left Soft Key">
                    <span>OPTIONS</span>
                    <span class="soft-label-sub">LSK</span>
                </button>
                <div class="center-tools">
                    <button id="btn-mute" class="ctrl-btn tool-btn" title="Toggle Sound">🔊</button>
                    <button id="btn-kbd-toggle" class="ctrl-btn tool-btn" title="Toggle Number Keypad">🔢</button>
                    <button id="btn-fullscreen" class="ctrl-btn tool-btn" title="Fullscreen">⛶</button>
                    <button id="btn-reset" class="ctrl-btn tool-btn" title="Restart Game">⟲</button>
                </div>
                <button id="btn-rsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F2" aria-label="Right Soft Key">
                    <span>BACK</span>
                    <span class="soft-label-sub">RSK</span>
                </button>
            </div>

            <!-- MAIN GAME CONTROLS: 8-WAY D-PAD (LEFT) + FIRE & *,0,# (RIGHT) -->
            <div class="main-pad-row">
                <!-- 3x3 8-Way D-Pad with Diagonals & Center OK -->
                <div class="dpad-8way-grid">
                    <!-- Row 1: Up-Left, Up, Up-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowLeft" aria-label="Up-Left">↖</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowUp" aria-label="Up">▲</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowRight" aria-label="Up-Right">↗</button>

                    <!-- Row 2: Left, Center OK, Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowLeft" aria-label="Left">◄</button>
                    <button class="ctrl-btn btn-3d dpad-cell dpad-center-ok" data-key="Enter" aria-label="OK">OK</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowRight" aria-label="Right">►</button>

                    <!-- Row 3: Down-Left, Down, Down-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowLeft" aria-label="Down-Left">↙</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowDown" aria-label="Down">▼</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowRight" aria-label="Down-Right">↘</button>
                </div>

                <!-- Right Thumb Action Area -->
                <div class="action-cluster">
                    <!-- Primary 3D Fire / Whip / Select Button -->
                    <button class="ctrl-btn btn-3d btn-3d-fire" data-key="Enter" aria-label="Fire / Whip / OK">
                        <span>FIRE</span>
                        <span class="btn-label-sub">WHIP / 5</span>
                    </button>

                    <!-- 3-Key Row: Star (*), Zero (0), Hash (#) -->
                    <div class="key-row-3">
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadAsterisk" aria-label="Star Key">
                            <span>✱</span>
                            <span class="sub-txt">ACT</span>
                        </button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="Digit0" aria-label="Zero Key">
                            <span>0</span>
                            <span class="sub-txt">+</span>
                        </button>
                        <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadDivide" aria-label="Hash Key">
                            <span>#</span>
                            <span class="sub-txt">SPC</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- COLLAPSIBLE NUMERIC KEYPAD -->
            <div id="num-keypad" class="hidden">
                <button class="ctrl-btn num-btn" data-key="Digit1">1</button>
                <button class="ctrl-btn num-btn" data-key="Digit2">2<span>ABC</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit3">3<span>DEF</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit4">4<span>GHI</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit5">5<span>JKL</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit6">6<span>MNO</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit7">7<span>PQRS</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit8">8<span>TUV</span></button>
                <button class="ctrl-btn num-btn" data-key="Digit9">9<span>WXYZ</span></button>
                <button class="ctrl-btn num-btn" data-key="NumpadAsterisk">*</button>
                <button class="ctrl-btn num-btn" data-key="Digit0">0<span>+</span></button>
                <button class="ctrl-btn num-btn" data-key="NumpadDivide">#</button>
            </div>
        </div>
    </div>

    <!-- CheerpJ WebAssembly Java Runtime -->
    <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
    <!-- Application Logic -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
