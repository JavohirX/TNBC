<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>The Nightmare Before Christmas - Mobile Player</title>
    <!-- Telegram Mini App WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --side-btn-width: 70px;
            --main-pad-height: 168px;
            --softkey-gap: 24px;
            --controls-panel-height: 250px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #08090d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #e0e2ec;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #0d0e15;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- SCREEN CONTAINER: PRESERVES 3:4 RATIO & FITS BY WIDTH --- */
        #screen-wrapper {
            width: 100%;
            flex: 0 0 auto;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #232635;
            overflow: hidden;
        }

        #screen-container {
            width: 100%;
            aspect-ratio: 3 / 4;
            max-height: calc(100dvh - var(--controls-panel-height, 250px));
            max-width: calc((100dvh - var(--controls-panel-height, 250px)) * 0.75);
            margin: 0 auto;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #display {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-color: #000;
        }

        #display:focus {
            outline: none;
        }

        /* --- BINARY HALLOWEEN SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            z-index: 99999;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .progress-bar-wrap {
            width: 320px;
            max-width: 85vw;
            height: 18px;
            background: #000000;
            border: 3px solid #ff7518;
            border-radius: 0;
            margin: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ff7518;
            border-radius: 0;
            transition: width 0.1s linear;
        }

        /* --- 3D TACTILE RETRO CONTROLS PANEL --- */
        .mobile-controls-panel {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: radial-gradient(circle at 50% 15%, #181b29 0%, #0a0b12 100%);
            border-top: 1px solid #292d3f;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Base 3D Tactile Button */
        .btn-3d {
            position: relative;
            border: none;
            outline: none;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.04s ease-out, box-shadow 0.04s ease-out, background 0.04s ease-out, color 0.04s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Dark Slate 3D Keycap */
        .btn-3d-dark {
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #e2e8f0;
            border-radius: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* 3D Button Mechanically Pressed Animation - Telegram UI Blue */
        .btn-3d-dark:active, .btn-3d-dark.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(41, 148, 236, 0.55);
            background: linear-gradient(180deg, #1b283d 0%, #121c2c 100%);
            color: #2994ec;
        }

        /* --- TOP SOFTKEY ROW --- */
        .softkey-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: var(--softkey-gap, 24px);
            padding: 0 2px;
        }

        /* Classic Nokia Horizontal Soft Keys */
        .btn-3d-soft {
            width: var(--side-btn-width, 70px);
            height: 35px;
            flex: 0 0 var(--side-btn-width, 70px);
            border-radius: 9px;
            background: linear-gradient(180deg, #444b68 0%, #2b3046 50%, #1e2232 100%);
            color: #f1f5f9;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 4px 0 #0c0e16,
                0 6px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-3d-soft:active, .btn-3d-soft.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #0c0e16,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 12px rgba(41, 148, 236, 0.55);
            background: linear-gradient(180deg, #1b283d 0%, #121c2c 100%);
            color: #2994ec;
        }

        .game-toast {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(13, 14, 21, 0.95);
            border: 1px solid #2994ec;
            color: #2994ec;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.85);
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .game-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- MAIN PAD AREA (OK on left + ENLARGED DPAD in middle + * 0 # on right) --- */
        .main-pad-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 1;
            padding: 2px 2px;
            width: 100%;
        }

        /* SQUARE 8-WAY D-PAD IN THE MIDDLE */
        .dpad-8way-grid {
            width: var(--main-pad-height, 168px);
            height: var(--main-pad-height, 168px);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            background: #11131e;
            padding: 5px;
            border-radius: 18px;
            border: 2px solid #24283c;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.75),
                inset 0 2px 6px rgba(0, 0, 0, 0.7);
            touch-action: none;
            flex-shrink: 0;
        }

        .dpad-cell {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            font-weight: 800;
            touch-action: none;
        }

        /* Cardinal Direction Arrows (▲, ▼, ◄, ►) */
        .dpad-cardinal {
            font-size: 1.35em;
            color: #f8fafc;
        }

        /* Diagonal Direction Arrows (↖, ↗, ↙, ↘) */
        .dpad-diagonal {
            font-size: 1.15em;
            color: #7dd3fc;
            background: linear-gradient(180deg, #2a2e42 0%, #1c1f2e 100%);
            border-radius: 6px;
        }

        .dpad-diagonal:active, .dpad-diagonal.active {
            color: #2994ec;
            background: linear-gradient(180deg, #1b283d 0%, #121c2c 100%);
            box-shadow: 0 0 10px rgba(41, 148, 236, 0.4);
        }

        /* D-Pad Center Pivot Hub (neutral dead-zone) */
        .dpad-center-hub {
            background: radial-gradient(circle at center, #1c1f2e 0%, #11131e 100%);
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.75);
            pointer-events: none;
        }

        /* 3D Action / OK Button - Width matches upper OPTNS button */
        .btn-3d-fire {
            width: var(--side-btn-width, 70px);
            height: var(--main-pad-height, 140px);
            flex: 0 0 var(--side-btn-width, 70px);
            border-radius: 12px;
            background: linear-gradient(180deg, #373c52 0%, #242838 52%, #191c28 100%);
            color: #f1f5f9;
            font-size: 1.15em;
            font-weight: 800;
            letter-spacing: 0.8px;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 4px 0 #090a10,
                0 6px 12px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-3d-fire:active, .btn-3d-fire.active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #090a10,
                0 2px 4px rgba(0, 0, 0, 0.8),
                inset 0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 14px rgba(41, 148, 236, 0.6);
            background: linear-gradient(180deg, #1b283d 0%, #121c2c 100%);
            color: #2994ec;
        }

        /* 3-Key Vertical Column for *, 0, # - Width matches upper BACK button */
        .key-col-3 {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            justify-content: space-between;
            width: var(--side-btn-width, 70px);
            height: var(--main-pad-height, 140px);
            flex: 0 0 var(--side-btn-width, 70px);
        }

        .btn-3d-trio {
            width: 100%;
            border-radius: 9px;
            font-size: 1.15em;
            font-weight: 800;
            flex: 1;
        }

        /* Small screens */
        @media (max-width: 360px) {
            :root {
                --side-btn-width: 58px;
                --main-pad-height: 148px;
                --softkey-gap: 16px;
                --controls-panel-height: 225px;
            }
            .softkey-row {
                gap: 4px;
                margin-bottom: 16px;
            }
            .btn-3d-soft {
                width: 58px;
                height: 32px;
                flex: 0 0 58px;
                font-size: 0.72rem;
            }
            .main-pad-row {
                gap: 5px;
            }
            .btn-3d-fire {
                width: 58px;
                height: 148px;
                flex: 0 0 58px;
                font-size: 0.95em;
            }
            .dpad-8way-grid {
                width: 148px;
                height: 148px;
                gap: 3px;
                padding: 4px;
            }
            .key-col-3 {
                width: 58px;
                height: 148px;
                flex: 0 0 58px;
                gap: 4px;
            }
            .btn-3d-trio {
                font-size: 1.05em;
            }
        }

        /* Landscape adjustments if rotated */
        @media (orientation: landscape) {
            #app-container {
                max-width: 100%;
                max-height: 100%;
                flex-direction: row;
                border-radius: 0;
            }
            #screen-wrapper {
                height: 100%;
                width: auto;
                max-height: 100%;
                flex: 0 0 auto;
                border-bottom: none;
                border-right: 2px solid #232635;
            }
            #screen-container {
                height: 100%;
                width: auto;
                aspect-ratio: 3 / 4;
                max-height: 100%;
                max-width: calc(100vh * 0.75);
            }
            .mobile-controls-panel {
                flex: 1;
                height: 100%;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <!-- BINARY HALLOWEEN SPLASH SCREEN (PURE BLACK & PUMPKIN ORANGE) -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="progress-bar-wrap">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="app-container">
        <!-- 3:4 SCREEN CONTAINER (FIT BY WIDTH) -->
        <div id="screen-wrapper">
            <div id="screen-container">
                <canvas id="display" tabindex="0"></canvas>
            </div>
        </div>

        <!-- LOWER CONTROLS PANEL (3D RETRO PHONE) -->
        <div class="mobile-controls-panel">
            <!-- TOP SOFTKEYS: OPTNS (LEFT) & BACK (RIGHT) -->
            <div class="softkey-row">
                <button id="btn-lsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F1" aria-label="Options">
                    <span>OPTNS</span>
                </button>
                <button id="btn-rsk" class="ctrl-btn btn-3d btn-3d-soft" data-key="F2" aria-label="Back">
                    <span>BACK</span>
                </button>
            </div>

            <!-- MAIN GAME CONTROLS: OK (LEFT) + ENLARGED RECTANGLE NAVIGATION (MIDDLE) + *,0,# (RIGHT) -->
            <div class="main-pad-row">
                <!-- Left: Rectangular OK Button -->
                <button id="btn-ok" class="ctrl-btn btn-3d btn-3d-fire" data-key="Enter" aria-label="OK">
                    <span>OK</span>
                </button>

                <!-- Middle: Giant Rectangle 8-Way D-Pad -->
                <div class="dpad-8way-grid" id="dpad-grid">
                    <!-- Row 1: Up-Left, Up, Up-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowLeft" data-dir="up-left" aria-label="Up-Left">↖</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowUp" data-dir="up" aria-label="Up">▲</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowUp,ArrowRight" data-dir="up-right" aria-label="Up-Right">↗</button>

                    <!-- Row 2: Left, Center Pivot Hub, Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowLeft" data-dir="left" aria-label="Left">◄</button>
                    <div class="dpad-cell dpad-center-hub" aria-hidden="true"></div>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowRight" data-dir="right" aria-label="Right">►</button>

                    <!-- Row 3: Down-Left, Down, Down-Right -->
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowLeft" data-dir="down-left" aria-label="Down-Left">↙</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-cardinal" data-key="ArrowDown" data-dir="down" aria-label="Down">▼</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark dpad-cell dpad-diagonal" data-key="ArrowDown,ArrowRight" data-dir="down-right" aria-label="Down-Right">↘</button>
                </div>

                <!-- Right: Star (*), Zero (0), Hash (#) Placed Vertically -->
                <div class="key-col-3">
                    <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadAsterisk" aria-label="Star Key">✱</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="Digit0" aria-label="Zero Key">0</button>
                    <button class="ctrl-btn btn-3d btn-3d-dark btn-3d-trio" data-key="NumpadDivide" aria-label="Hash Key">#</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 100% Pure Native JavaScript Engine Entrypoint -->
    <script type="module">
        window.addEventListener('error', (e) => console.error("Global Error:", e.message, e.filename, e.lineno, e.error));
        window.addEventListener('unhandledrejection', (e) => console.error("Unhandled Rejection:", e.reason));

        // Telegram Mini App Auto-Ready & Expanded Mode (middle mode)
        function initTelegramWebApp() {
            if (!window.Telegram?.WebApp) return;
            try {
                const tg = window.Telegram.WebApp;
                tg.ready();

                // 1. Expand to maximum height while preserving standard Telegram navigation header
                tg.expand();

                // 2. Disable vertical swipes to prevent pull-to-close dismiss during game taps
                if (typeof tg.disableVerticalSwipes === 'function') {
                    try { tg.disableVerticalSwipes(); } catch (_) {}
                }

                // 3. Lock orientation to portrait if supported
                if (typeof tg.lockOrientation === 'function') {
                    try { tg.lockOrientation('portrait'); } catch (_) {}
                }

                // 4. Immersive theme colors
                try {
                    if (tg.setHeaderColor) tg.setHeaderColor("#08090d");
                    if (tg.setBackgroundColor) tg.setBackgroundColor("#08090d");
                    if (tg.setBottomBarColor) tg.setBottomBarColor("#08090d");
                } catch (_) {}

                // 5. Viewport change safety handler: keep expanded
                tg.onEvent?.('viewportChanged', () => {
                    if (!tg.isExpanded) {
                        try { tg.expand(); } catch (_) {}
                    }
                });

                console.log("Telegram Mini App SDK loaded in Expanded Mode (top navigation header preserved)!");
            } catch (tgErr) {
                console.warn("Telegram WebApp init warning:", tgErr);
            }
        }

        initTelegramWebApp();

        // Safety handler: Ensure expanded on first user gesture without forcing full-screen takeover
        const ensureExpandedOnGesture = () => {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                if (!tg.isExpanded) {
                    try { tg.expand(); } catch (_) {}
                }
            }
        };
        window.addEventListener('pointerdown', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('touchstart', ensureExpandedOnGesture, { passive: true });
        window.addEventListener('click', ensureExpandedOnGesture, { passive: true });

        // Explicit cache buster to guarantee fresh asset loading across mobile/TMA webviews
        const APP_BUILD_HASH = "v20261022_b15";
        import(`../engine/main.js?v=${APP_BUILD_HASH}`).then(({ startNativeEngine }) => {
            return startNativeEngine(`../assets/`, APP_BUILD_HASH);
        }).catch(err => {
            console.error("Engine Start Error:", err);
            window.__lastErr = err.message + '\n' + err.stack;
        });
    </script>
</body>
</html>
